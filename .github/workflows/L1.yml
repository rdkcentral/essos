name: L1 Test Suite - Essos Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        build_type: [Debug, Release]
        coverage: [ON, OFF]
        exclude:
          # Only enable coverage for Debug builds
          - build_type: Release
            coverage: ON
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install System Dependencies
      run: |
        chmod +x scripts/setup.sh
        ./scripts/setup.sh
    
    - name: Display Build Configuration
      run: |
        echo "=========================================="
        echo "L1 Test Suite for Essos - CI Build"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage: ${{ matrix.coverage }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "=========================================="
    
    - name: Verify Source Structure
      run: |
        echo "Verifying source structure..."
        if [ ! -f "essos.cpp" ]; then
          echo "ERROR: essos.cpp not found!"
          exit 1
        fi
        if [ ! -f "configure.ac" ]; then
          echo "ERROR: configure.ac not found!"
          exit 1
        fi
        echo "✓ Source structure verified"
        ls -la
    
    - name: Build L1 Tests
      run: |
        chmod +x scripts/build.sh
        if [ "${{ matrix.coverage }}" = "ON" ]; then
          ./scripts/build.sh --l1 --jobs $(nproc)
        else
          ./scripts/build.sh --l1 --jobs $(nproc)
        fi
    
    - name: Display Coverage Summary
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        if [ -f "L1/build/coverage.info" ]; then
          echo "=========================================="
          echo "Coverage Summary:"
          echo "=========================================="
          lcov --list L1/build/coverage.info | tee coverage_summary.txt
          echo "=========================================="
          echo ""
          echo "📊 L1 Coverage HTML Report will be available in artifacts"
          echo "   Download 'coverage-report-html' artifact and open index.html"
        fi
    
    - name: Upload Coverage HTML Report
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: L1/build/coverage/
        retention-days: 30
    
    - name: Upload Coverage Summary
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: coverage-summary
        path: coverage_summary.txt
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Upload Coverage Info File
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: coverage-info
        path: L1/build/coverage.info
        retention-days: 30
    
    - name: Upload Build Artifacts
      if: always() && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts-${{ matrix.build_type }}-coverage-${{ matrix.coverage }}
        path: |
          L1/build/essos_l1_tests
          L1/build/**/*.so
          L1/build/**/*.a
        retention-days: 14
        if-no-files-found: ignore
    
    - name: Generate Coverage Badge Data
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON'
      run: |
        if [ -f "L1/build/coverage.info" ]; then
          # Extract coverage percentage
          COVERAGE=$(lcov --summary L1/build/coverage.info 2>&1 | grep "lines" | grep -oP '\d+\.\d+(?=%)')
          echo "Total Coverage: ${COVERAGE}%"
          echo "COVERAGE_PERCENTAGE=${COVERAGE}" >> $GITHUB_ENV
          
          # Create badge JSON
          mkdir -p badge
          cat > badge/coverage.json << EOF
        {
          "schemaVersion": 1,
          "label": "coverage",
          "message": "${COVERAGE}%",
          "color": "$(if (( $(echo "$COVERAGE >= 70" | bc -l) )); then echo 'green'; elif (( $(echo "$COVERAGE >= 50" | bc -l) )); then echo 'yellow'; else echo 'red'; fi)"
        }
        EOF
          cat badge/coverage.json
        fi
    
    - name: Upload Coverage Badge
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && !env.ACT
      uses: actions/upload-artifact@v4
      with:
        name: coverage-badge
        path: badge/
        retention-days: 30
        if-no-files-found: ignore
    
    - name: Comment Coverage on PR
      if: matrix.build_type == 'Debug' && matrix.coverage == 'ON' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverageFile = 'L1/build/coverage.info';
          
          if (fs.existsSync(coverageFile)) {
            const { execSync } = require('child_process');
            const summary = execSync('lcov --summary L1/build/coverage.info 2>&1').toString();
            
            const comment = `## Coverage Report - Essos L1\n\n\`\`\`\n${summary}\n\`\`\`\n\n📊 Full coverage report available in artifacts.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          }
    
    - name: Build Summary
      if: always()
      run: |
        echo "=========================================="
        echo "Build Summary"
        echo "=========================================="
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Coverage Enabled: ${{ matrix.coverage }}"
        echo "Status: ${{ job.status }}"
        if [ "${{ matrix.coverage }}" = "ON" ] && [ "${{ matrix.build_type }}" = "Debug" ]; then
          echo ""
          echo "📊 Coverage artifacts uploaded:"
          echo "   • coverage-report-html - Full HTML coverage report"
          echo "   • coverage-summary - Text summary of coverage"
          echo "   • coverage-info - LCOV info file"
          echo "   • coverage-badge - Badge JSON data"
          echo ""
          echo "To view the coverage report:"
          echo "   1. Download 'coverage-report-html' artifact"
          echo "   2. Extract the zip file"
          echo "   3. Open index.html in your browser"
        fi
        echo "=========================================="
