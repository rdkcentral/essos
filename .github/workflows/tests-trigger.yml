name: tests-trigger

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
  push:
    branches: [main, develop, 'sprint/**', 'release/**']
  pull_request:
    branches: [main, develop, 'sprint/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essos-build:
    name: Build Essos
    uses: ./.github/workflows/essos-main-build.yml
    with:
      caller_source: local

  l1-tests:
    name: L1 tests (Essos)
    uses: ./.github/workflows/L1-tests.yml
    with:
      caller_source: local
