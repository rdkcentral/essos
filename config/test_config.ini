# Test Configuration for Essos L1 Tests
# This file defines test parameters, expected results, and validation criteria

[test_suite]
name = "Essos L1 Test Suite"
version = "1.0"
framework = "Google Test"
language = "C++"
standard = "C++14"

[coverage_targets]
line_coverage_min = 85
function_coverage_min = 90
branch_coverage_min = 80

[test_categories]
context_management = 25
display_configuration = 30
input_events = 40
gamepad_support = 25
platform_specific = 15
stress_boundary = 15

[expected_results]
total_tests = 150
expected_pass = 140
expected_skip = 5
expected_fail = 0
max_execution_time_ms = 30000

[test_environments]
# Primary testing environments
primary_os = ["Ubuntu 20.04", "Ubuntu 22.04", "CentOS 8"]
secondary_os = ["Windows 10 WSL", "Debian 11"]
architectures = ["x86_64", "aarch64"]

[dependencies]
build_tools = ["cmake>=3.10", "gcc>=7.0", "make"]
test_libraries = ["gtest>=1.10", "gmock>=1.10"]
system_libraries = ["libegl1-mesa-dev", "libwayland-dev", "libwayland-egl1-mesa"]
optional_libraries = ["libwayland-cursor0", "libwayland-client0"]

[test_parameters]
# Context creation limits
max_concurrent_contexts = 10
context_creation_timeout_ms = 5000

# Display configuration ranges  
min_display_width = 1
max_display_width = 65535
min_display_height = 1
max_display_height = 65535

# Key repeat configuration
min_key_repeat_delay = 1
max_key_repeat_delay = 10000
min_key_repeat_period = 1
max_key_repeat_period = 5000

# EGL configuration
supported_egl_versions = ["1.4", "1.5"]
required_egl_extensions = ["EGL_KHR_create_context"]

[test_data]
# Standard display modes to test
display_modes = [
    "640x480",
    "800x600", 
    "1024x768",
    "1280x720",
    "1920x1080",
    "3840x2160"
]

# Invalid display modes for negative testing
invalid_display_modes = [
    "",
    "0x0",
    "invalid",
    "abc123",
    "-100x-100"
]

# Key codes for testing (Linux input.h values)
test_key_codes = [
    1,    # KEY_ESC
    2,    # KEY_1
    16,   # KEY_Q
    17,   # KEY_W
    28,   # KEY_ENTER
    57,   # KEY_SPACE
    103,  # KEY_UP
    104,  # KEY_PAGE_UP
    105,  # KEY_LEFT
    106   # KEY_RIGHT
]

# Mouse button codes
test_mouse_buttons = [
    0x110,  # BTN_LEFT
    0x111,  # BTN_RIGHT  
    0x112,  # BTN_MIDDLE
    0x113,  # BTN_SIDE
    0x114   # BTN_EXTRA
]

# Gamepad button codes
test_gamepad_buttons = [
    0x130,  # BTN_A
    0x131,  # BTN_B
    0x132,  # BTN_C
    0x133,  # BTN_X
    0x134,  # BTN_Y
    0x135,  # BTN_Z
    0x136,  # BTN_TL
    0x137   # BTN_TR
]

[stress_test_parameters]
# Resource exhaustion testing
max_memory_usage_mb = 1024
max_file_descriptors = 1024
context_creation_iterations = 1000
concurrent_operation_threads = 8
test_duration_seconds = 300

[validation_criteria]
# Performance benchmarks
max_context_creation_time_ms = 1000
max_window_creation_time_ms = 2000
max_event_callback_latency_ms = 10
max_display_mode_switch_time_ms = 5000

# Memory usage limits
max_memory_per_context_kb = 1024
max_total_memory_usage_mb = 512
zero_memory_leaks = true

# Error handling requirements
proper_null_pointer_handling = true
graceful_resource_exhaustion = true
consistent_error_reporting = true

[platform_specific]
# Wayland-specific tests
wayland_required_protocols = ["wl_compositor", "wl_output", "wl_seat"]
wayland_optional_protocols = ["xdg_wm_base", "wl_shell"]

# Direct EGL specific tests  
direct_required_extensions = ["EGL_MESA_platform_gbm", "EGL_KHR_platform_gbm"]
direct_device_paths = ["/dev/dri/card0", "/dev/dri/renderD128"]

# Windows WSL considerations
wsl_display_server = "X11"  # or "Wayland" if supported
wsl_egl_platform = "surfaceless"

[ci_cd_configuration]
# Continuous Integration settings
parallel_jobs = 4
timeout_minutes = 30
artifact_retention_days = 30

# Required CI stages
stages = ["build", "unit_test", "integration_test", "coverage", "static_analysis"]

# Failure thresholds
max_test_failures = 0
min_coverage_pass = 80
max_static_analysis_warnings = 10

[debugging]
# Debug logging levels
log_levels = ["FATAL", "ERROR", "WARNING", "INFO", "DEBUG", "TRACE"]
default_log_level = "INFO"
test_log_level = "DEBUG"

# Debug tools
memory_checker = "valgrind"
static_analyzer = "cppcheck" 
profiler = "perf"
coverage_tool = "gcov"

[reporting]
# Output formats
test_result_formats = ["xml", "json", "console"]
coverage_formats = ["html", "lcov", "cobertura"]
report_directory = "test_reports"

# Report content
include_system_info = true
include_build_info = true
include_timing_data = true
include_memory_usage = true

[security]
# Security testing considerations
input_sanitization = true
buffer_overflow_protection = true
privilege_escalation_checks = true
secure_defaults = true

[performance]
# Performance testing thresholds
max_cpu_usage_percent = 80
max_memory_growth_per_hour_mb = 10
max_response_time_p95_ms = 100
min_throughput_ops_per_second = 1000

[maintenance]
# Test maintenance guidelines
test_review_frequency_months = 3
dependency_update_frequency_months = 6
platform_support_lifecycle_years = 3
documentation_update_frequency_months = 1